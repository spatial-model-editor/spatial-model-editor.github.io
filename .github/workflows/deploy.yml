name: "Build and deploy to gh-pages"

on:
  push:
  # rebuild daily to pick up new releases from the spatial-model-editor CHANGELOG
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "dist/"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
